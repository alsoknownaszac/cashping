# ---------------------------------------------------------------------------
# Cashping backend on Render, as *staging*: one file, one sync.
#
# `New -> Blueprint` in the Render Dashboard, pointed at this repository
# (`alsoknownaszac/cashping`; the Blueprint Path is `render.yaml`, which is the
# default) and every resource below is created in that workspace: the Postgres
# database, the Key Value instance the payments queue lives on, and the API
# itself. A `main` push redeploys the API (`autoDeploy`), and a change to this
# file is applied by re-syncing the Blueprint.
#
# Staging, not production, in three concrete senses:
#
#   - The API runs against Stellar's Testnet, so nothing here can move real
#     money: `STELLAR_NETWORK=TESTNET` plus a Horizon URL and a USDC issuer that
#     exist on that network are the whole of that statement.
#   - It runs with `NODE_ENV=production`, deliberately. The boot-time guards that
#     protect custody (Step 18) fire only in production, and an environment that
#     never exercised them would be the first place they ever fire. That is also
#     why `AWS_ENDPOINT_URL` is absent below, and must stay absent.
#   - Swagger is left on (`ENABLE_SWAGGER=true`), which `.env.example` advises
#     against for a public production host. Staging exists so the frontend team
#     can call the real API and read `/api/docs` while they do it, and this host
#     is not linked from anywhere; the advice still applies the day this file is
#     copied for production.
#
# All three resources are on Render's `free` plan, which is the fourth thing that says
# "staging" and the one with a clock attached: the database expires 30 days after creation,
# the Key Value instance keeps nothing across a restart, and the API itself is spun down
# after 15 minutes without an inbound request. Each `plan:` below states what its plan costs
# and what it takes away, and the README argues the whole trade in one place.
#
# Nothing here is a secret. Values a person has to be told are `sync: false` -
# prompted for in the Dashboard on the first sync - and the one value that can
# simply be generated (`JWT_SECRET`) is generated by Render rather than written
# down here.
# ---------------------------------------------------------------------------

databases:
  # The API's Postgres, on the private network only. Every DATABASE_URL this
  # workspace hands out points at that private address, so the API service and
  # nothing else can reach it - `ipAllowList: []` below is what makes "nothing
  # else" a fact rather than a hope. The migration that used to run as a
  # separate pre-deploy step now runs inside that same service (see
  # `startCommand` below), so "the API" covers both.
  #
  # `postgresMajorVersion: '16'` states what docker-compose.yml runs, which is
  # what every migration and every e2e run in this repository was executed
  # against. Left unset, Render would use its newest supported major, and the
  # first migration this database saw would be tried on a version nobody has run
  # before.
  #
  # `plan: free`, and the clock is the reason this is written down rather than
  # discovered: a Free Postgres instance expires 30 days after creation, then has
  # a 14-day grace period before Render deletes it and its data. It is also fixed
  # at 1 GB of storage (0.1 CPU, 256 MB, 100 connections), with no backups, no
  # managed connection pooling and no read replicas - and Render may restart it
  # or take it down for maintenance at any time. A disposable database on a
  # schedule nobody here controls is what staging is; the README records that
  # upgrading to `0.1c-256mb` (Render's smallest paid type) is the first thing to
  # do when this environment stops being disposable.
  #
  # The paid-only fields are absent on purpose rather than forgotten:
  # `diskSizeGB` (free storage is fixed at 1 GB), `connectionPool` (no managed
  # pooling on free), `readReplicas` and `highAvailability` (neither is offered).
  # Each of those is a field in Render's schema, which is how their absence stays
  # readable as a decision.
  - name: cashping-staging-db
    databaseName: cashping
    user: cashping
    region: frankfurt
    plan: free
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  # Redis for BullMQ (submission jobs and the confirmation sweep), the OTP rate
  # limiter and the idempotency store - the one `REDIS_URL` this application
  # reads, for all four.
  #
  # `maxmemoryPolicy: noeviction` is not a tuning preference. BullMQ blocks on
  # connections and holds job state in keys, so an instance that evicted them
  # under memory pressure would drop a queued submission. Render's default is
  # `allkeys-lru`. (Step 26 makes the work list the `transactions` table rather
  # than the keyspace, so an eviction costs a delay rather than a payment nothing
  # will look at again - which is why this is a preference and not a
  # load-bearing setting.)
  #
  # `plan: free`, and this is the sharpest of the three trades: 25 MB with a
  # 50-connection limit, and no persistence at all - Render's free tier forces
  # `persistenceMode` off, so a restart deletes every key, and Render reserves the
  # right to restart a free instance whenever it likes ("thereby deleting its
  # data"). Those keys are not a cache here: they are the rate-limit counters, the
  # idempotency claims, the BullMQ queue and the confirmation sweep's schedule.
  # Lose the queue and a queued submission is gone with nothing in the
  # application that re-drives it - the row stays PENDING with its amount
  # reserved. `persistenceMode` is deliberately not set, because free ignores it;
  # a paid upgrade should set `journal-snapshot`. The README states what one
  # restart costs, item by item.
  #
  # `maxmemoryPolicy` is not restricted by plan - it is an ordinary setting on a
  # free instance too, and the 25 MB makes it matter more, not less: `noeviction`
  # returns an error on a write once the instance is full, where evicting would
  # silently drop a queued submission. A rejected write is visible; an evicted job
  # was not.
  - type: keyvalue
    name: cashping-staging-kv
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # The API. Native Node, not Docker, and this is where the trade is argued
  # because it is where it is made. The image's runtime stage had to be told, one
  # `COPY` at a time, which of the things `nest build` already knows about must
  # travel into a `--omit=dev` layer - `prisma/`, the migrations,
  # `prisma7.config.ts`, and `dotenv`, a dev-only package that config imports -
  # and a build that copies the wrong set fails at *start*, behind `/bin/sh -c`,
  # on an instance with no shell to look from. A native runtime keeps it a single
  # build in one directory: `prisma` is a production dependency, so the same tree
  # that compiles the app also migrates and boots it, and nothing is copied
  # between stages. `docker-compose.yml` still builds and runs the API locally;
  # this changes only how Render builds and runs it.
  - type: web
    name: cashping-staging
    runtime: node
    branch: main
    region: frankfurt
    # Which Node builds and runs this service is `NODE_VERSION`, an entry in
    # `envVars` below - not a field here, because the Blueprint schema has no
    # such field: `serverService` in `https://render.com/schema/render.yaml.json`
    # sets `additionalProperties: false` and defines no `nodeVersion`, so the key
    # would be a validation error rather than a pin. Render's own list of the
    # ways to choose a version is the `NODE_VERSION` variable, `.node-version`,
    # `.nvmrc` and `engines` - and the variable is first of the four, so it wins
    # over any of those files added to the repository later. It is set at all
    # because nothing else in the repository answers "which Node?": there is no
    # `engines` field, no `.nvmrc` and no `.node-version`. 24 is the line the
    # runtime image used (`node:24-alpine`) and the one development and every e2e
    # run here executed against, so inheriting Render's default - which Render
    # decides, and which moves - would boot the API on a version no local run has
    # exercised.

    # `plan: free`: 0.1 CPU and 512 MB, and - the part that changes how the
    # environment behaves - a Free web service is spun down after 15 minutes with
    # no inbound traffic and takes about a minute to wake again. While it is
    # asleep nothing runs: the BullMQ worker and the confirmation sweep live
    # inside this process, so queued work waits for whatever request wakes it.
    # Free web services also get no shell (SSH or Dashboard) and no one-off jobs,
    # so an incident is diagnosed from the log and the API rather than from a
    # shell on the instance - worth knowing before the first one. A free
    # instance also refuses `maxShutdownDelaySeconds` and `preDeployCommand`
    # (both noted below), which is why the 30-second graceful-shutdown window is
    # Render's default here rather than a value this file sets. `1c-2g` (paid)
    # is the upgrade path.
    plan: free
    # One instance, and this is not a cost decision. The BullMQ worker that
    # submits payments runs *inside the API process* (Step 26's choice, argued in
    # `payments.processor.ts`), and the confirmation sweep registers its schedule
    # in Redis from that same process. A second replica would be a second
    # consumer of one queue and a second registrant of one schedule - Redis
    # tolerates both, but this stage has no throughput that needs them, and one
    # process is one thing to watch. It is also the only value the free plan
    # allows: "Scaling beyond a single instance" is one of the features Render's
    # free web services do not have.
    numInstances: 1
    # The liveness endpoint, and the only path worth pointing a load balancer at:
    # no auth, no database call, no Redis call. Its own docblock records that
    # this is the URL a health check is aimed at - this is that health check.
    healthCheckPath: /v1/health
    # The build: the dependencies, the generated Prisma client, then the compile.
    # `--include=dev` is not optional. `NODE_ENV=production` (below) is in the
    # build environment too, and npm omits dev dependencies when it is set, which
    # would drop `@nestjs/cli`, `typescript` and `dotenv` before `nest build` or
    # the start command ever ran. `prisma generate` has to precede the compile
    # because the generated client lives under `src/` and is gitignored: it does
    # not exist on a fresh clone, and `nest build` cannot compile the code that
    # imports it. The CLI is addressed by its local path so that no npm process
    # sits in front of it, the same reason the start command addresses it so.
    buildCommand: npm ci --include=dev && ./node_modules/.bin/prisma generate && npm run build
    # The start command. The service is `runtime: node`, so this is `startCommand`
    # and not the container's `dockerCommand` it used to be - the string is the
    # same `node dist/main.js` with one step prefixed to it: the migration, which
    # used to be `preDeployCommand`. Render refused that field on a free web service
    # ("not supported for free tier services"), so the migration runs here
    # instead, in the instance that is starting. Render runs this string
    # through `/bin/sh -c`, so `&&` is a shell chain: if `migrate deploy` exits
    # non-zero the app never starts, the instance never answers
    # `healthCheckPath`, and the deploy fails while the previous version keeps
    # serving - the outcome the pre-deploy step gave, reached through the
    # health check instead of through a step that gates traffic.
    #
    # The `exec` in front of `node` is what keeps the shell from outliving its
    # use. A `/bin/sh` that *forked* the app would be the process Render signals,
    # and it does not forward SIGTERM to that child - so `app.enableShutdownHooks()`
    # in `main.ts`, which closes the Prisma pool and the queue producer, would
    # never run and the instance would be SIGKILLed with its connections still
    # open. `exec` replaces the shell with `node`, so the signal the platform
    # sends lands on the app rather than on a shell that used to wrap it. The
    # `Dockerfile` reaches the same place by a different route - an `ENTRYPOINT`
    # of `tini` as PID 1 - which is what covers the `docker-compose.yml` service,
    # where this file's start command is not the one that runs.
    #
    # `DATABASE_URL` is this service's internal one, so the migration reaches
    # the database over the private network. The CLI is addressed by its local
    # path, `./node_modules/.bin/prisma`, rather than `npx --no-install prisma`:
    # both resolve to the version pinned in the lockfile (`prisma` is a
    # production dependency, so the binary is installed at build time), but `npx`
    # puts a whole npm process in front of the migration, and a free instance
    # offers no shell - the deploy log is the only diagnosis there is, so
    # nothing is put between the migration's output and it. The schema, the
    # migrations and the Prisma 7 config are in the repository for exactly this
    # line, beside the app they configure. No `--config` flag is needed:
    # `prisma7.config.*` is the *first* candidate in the installed CLI's own
    # config-file list, ahead of `prisma.config.*`.
    #
    # Running this on every start, and not once per deploy, is the part that
    # had to be measured rather than assumed, because a free web service wakes
    # from its 15-minute sleep by starting this very command again. Measured
    # 2026-10-01 against a throwaway database (local Postgres 18.3; the
    # blueprint pins 16): the first run applied 7 migrations and exited 0, a
    # second run and a third behind `sh -c` printed "No pending migrations to
    # apply" and exited 0, and `_prisma_migrations` still held exactly 7 rows.
    # That is Prisma v7's documented behaviour - `migrate deploy` "Applies
    # pending migrations" and "Does not reset the database" - and Prisma takes
    # an advisory lock (10s timeout) around the run, so two instances cannot
    # migrate at once.
    #
    # What it costs: the first request after a sleep now waits for the
    # migration check on top of the ~1-minute spin-up.
    startCommand: ./node_modules/.bin/prisma migrate deploy && exec node dist/main.js
    # `maxShutdownDelaySeconds: 30` was here and is gone for the same reason:
    # a free web service refuses it ("not supported for free tier
    # services"). The 30-second window still applies - it is Render's default -
    # but it is a default now rather than a value this file sets, and a free
    # instance can also be restarted at any time or slept for 15 idle minutes.
    # An in-flight submission cut off by a SIGKILL is still re-queued by
    # BullMQ's stalled-job check (`maxStalledCount`, 1 by default) rather than
    # lost; what the field bought was the buffer that made that the rare case
    # instead of the ordinary one. The README records it as a known free-tier
    # gap, so this is a stated trade rather than a silent removal.
    autoDeploy: true

    envVars:
      # --- Runtime -----------------------------------------------------------
      # Not `development`. See the header: production is what turns the custody
      # guards on, and this is the environment they get rehearsed in.
      - key: NODE_ENV
        value: production

      # The Node line, and the only way this file can state it (see the note
      # above `plan:`). An ordinary environment variable rather than a special
      # field: Render reads `NODE_VERSION` ahead of `.node-version`, `.nvmrc` and
      # `engines`, so the version here is the version even if one of those files
      # is added to the repository later. `24` is a bounded major range, and
      # tracks the latest 24.x - which is what `node:24-alpine`, the image every
      # local and every e2e run used, tracks too.
      - key: NODE_VERSION
        value: '24'

      # `PORT` is deliberately not set, because Render owns it: every Render web
      # service must bind `0.0.0.0` and Render injects `PORT` into it - **10000**
      # by default, changed only by setting this variable yourself. A native
      # runtime has no image, so there is no `EXPOSE 3000` for anyone to mistake
      # for this value; what listens is `main.ts` on the validated `PORT` (the
      # `?? 3000` in `configuration.ts` is the laptop default and never applies
      # here), so the port the app binds and the port Render scans agree because
      # both are `PORT`. Bind 3000 instead - the mistake the `Dockerfile`'s
      # `EXPOSE 3000` still invites on the docker-compose route, which is the
      # only route that image travels any more - and the deploy fails exactly one
      # way: "Port scan timeout reached, no open HTTP ports detected".

      # --- Datastores --------------------------------------------------------
      # Internal connection strings: Render injects each datastore's
      # private-network address, which the running service reads - the
      # migration in its start command included, since that is now the same
      # process rather than a separate pre-deploy step.
      - key: DATABASE_URL
        fromDatabase:
          name: cashping-staging-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: cashping-staging-kv
          type: keyvalue
          property: connectionString

      # --- Interactive docs / CORS -------------------------------------------
      # On, on purpose - see the header.
      - key: ENABLE_SWAGGER
        value: 'true'

      # No default, because a guess here is a browser that cannot reach the API:
      # a real frontend origin, or the list stays empty until somebody sets it.
      # `.env.example` records the shape the validator enforces (scheme, host,
      # optional port, no trailing slash) - a value a browser would never send
      # stops the boot rather than the request.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- Auth --------------------------------------------------------------
      # Generated by Render on the first sync and kept from then on. It is the
      # one value in this file with no external party to come from, which is why
      # it is generated rather than left for someone to invent.
      - key: JWT_SECRET
        generateValue: true

      # --- Payments queue ----------------------------------------------------
      # The confirmation sweep, on. `0` - the default - registers no schedule at
      # all, so a payment sits PROCESSING until somebody runs a tick by hand:
      # right for a laptop, wrong for an environment whose whole job is to behave
      # like the real thing. 5000ms matches Stellar's ledger close time, so a
      # faster poll would mostly re-ask a question whose answer cannot have
      # changed.
      - key: PAYMENTS_CONFIRMATION_INTERVAL_MS
        value: '5000'

      # --- Notifications (Africa's Talking) ----------------------------------
      # Prompted for together because they have to match: the username picks the
      # host (`sandbox` is served by the sandbox host, anything else by the live
      # one) and a sandbox key is refused by the live host with a 401.
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false

      # Resend's API key, for the verification and receipt email (Step 34c).
      # Required: no email is sent without it. Until `cashping.app` is verified in
      # Resend's dashboard the sender uses Resend's shared test address
      # (`onboarding@resend.dev`), which only delivers to the Resend account's own
      # address - so a test send here reaches the account owner and nobody else.
      - key: RESEND_API_KEY
        sync: false

      # --- Email provider (staging) ------------------------------------------
      # Staging sends verification and receipt email through Brevo's SMTP relay
      # instead of Resend, so a code reaches an arbitrary external inbox from a
      # *single-sender-verified* address: Brevo confirms one from-address by an
      # email link, so nothing here needs a sending domain or the SPF/DKIM records a
      # verified Resend domain would. `smtp` is a real sender, so - unlike `mailtrap` -
      # the boot-time guard allows it with `NODE_ENV=production` above. The *default*
      # (an unset `EMAIL_SENDER`) is `resend`, so a production deploy keeps Resend and
      # only this file opts a staging environment into the relay; nothing reaches Brevo
      # by accident.
      #
      # Port 2525, deliberately: it is a non-standard SMTP port that hosting platforms
      # do not block the way they sometimes block 25/465/587, so the relay is reachable
      # from Render whatever the network policy. `SmtpEmailSender` upgrades 2525 with
      # STARTTLS - only 465 is implicit TLS. Host and port are the same for every Brevo
      # account, so they are plain values here; the username (the Brevo login email) and
      # the password (the generated *SMTP key*, not the API key) are secrets and are
      # prompted for. `EMAIL_FROM` must be the exact address verified as a sender in
      # Brevo, or the relay refuses every message - so it is prompted for rather than
      # guessed.
      #
      # One Brevo setting matters and is *not* in this file: Security -> Authorized IPs.
      # With "Block unknown IP addresses" on, the relay answers `525 5.7.1 Unauthorized
      # IP address` for every login - the key and sender are fine, the source is not.
      # Render's outbound IPs are dynamic, so whitelisting them is not durable; leave the
      # block off (or on "Automatic authorization") and any egress IP is accepted.
      - key: EMAIL_SENDER
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # --- Error reporting ---------------------------------------------------
      - key: SENTRY_DSN
        sync: false
      # Tagged, so staging's noise can be filtered away from anything else in the
      # same Sentry project - and so a staging report is identifiable on sight.
      - key: SENTRY_ENVIRONMENT
        value: staging

      # --- AWS / KMS (custody, Step 18) --------------------------------------
      # Every account's seed is wrapped under this key, so there is no value here
      # that is safe to guess: all four are prompted for. `AWS_KMS_KEY_ID` must be
      # a key in `AWS_REGION` - KMS keys are regional, and a key from another
      # region comes back as NotFoundException, which reads like a deleted key.
      #
      # `AWS_ENDPOINT_URL` is absent, and has to stay absent. It exists so a
      # developer can point KMS at a local emulator, and `NODE_ENV=production`
      # (above) makes the validator refuse to boot when it is set: custody aimed
      # at a non-AWS endpoint while `AWS_KMS_KEY_ID` still names an AWS key is a
      # different trust boundary, and seeds would be wrapped under a key the
      # configuration does not claim. That guard firing on a misconfigured
      # staging is the guard working.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_KMS_KEY_ID
        sync: false

      # --- Stellar -----------------------------------------------------------
      # Three literal values, because none of them is a secret and all three have
      # to agree: the network, the Horizon endpoint that serves it, and the USDC
      # issuer that exists on it. The issuer is a *key* rather than a code -
      # `USDC:GBBD...` and `USDC:GDHU...` are two different assets that happen to
      # share a code - so the one below is Circle's Testnet issuer, the value
      # `.env.example` ships. A PUBLIC deployment sets the mainnet issuer here
      # and funds new accounts from a treasury instead of a faucet, which is why
      # `STELLAR_FRIENDBOT_URL` is left at its default: on Testnet the default is
      # Stellar's own faucet and there is nothing to configure.
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_USDC_ISSUER
        value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
