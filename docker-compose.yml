services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      # Host port defaults to 3000; override with API_HOST_PORT when 3000 is
      # already taken on the host (e.g. by another local dev server).
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      # busybox wget ships with node:24-alpine, so no extra tooling is needed.
      # This catches a container that is up but not actually serving.
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashping
      POSTGRES_PASSWORD: cashping
      POSTGRES_DB: cashping
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashping -d cashping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
