services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network Postgres/Redis are reached by service name, so
      # these two are built here rather than read from the host .env (a host
      # DATABASE_URL would point at localhost, which is the container itself).
      DATABASE_URL: postgresql://cashping:cashping@postgres:5432/cashping?schema=public
      REDIS_URL: redis://redis:6379
      # Everything below is required by the Step 4 env schema. Values fall back
      # to placeholders so `docker compose up` works on a fresh clone with no
      # .env; Compose picks the real values up from ./.env when it exists.
      JWT_SECRET: ${JWT_SECRET:-local-compose-placeholder-secret}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-local-compose-placeholder-key}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      SENTRY_DSN: ${SENTRY_DSN:-https://placeholder@example.com/0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-compose-placeholder}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-compose-placeholder}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-local-compose-placeholder}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-TESTNET}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
    ports:
      # Host port defaults to 3000; override with API_HOST_PORT when 3000 is
      # already taken on the host (e.g. by another local dev server).
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      # busybox wget ships with node:24-alpine, so no extra tooling is needed.
      # This catches a container that is up but not actually serving.
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashping
      POSTGRES_PASSWORD: cashping
      POSTGRES_DB: cashping
    ports:
      # Host port is overridable for the same reason as API_HOST_PORT: a machine
      # that already runs its own Postgres on 5432 keeps the more specific
      # 127.0.0.1 binding, shadowing this container, so host-side tools (the
      # Prisma CLI) would silently talk to the wrong server and fail with a
      # confusing P1010. Set POSTGRES_HOST_PORT in .env (and match it in
      # DATABASE_URL) when that happens.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashping -d cashping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # See POSTGRES_HOST_PORT above - same reason, same fix.
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
