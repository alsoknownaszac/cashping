services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network Postgres/Redis are reached by service name, so
      # these two are built here rather than read from the host .env (a host
      # DATABASE_URL would point at localhost, which is the container itself).
      DATABASE_URL: postgresql://cashping:cashping@postgres:5432/cashping?schema=public
      REDIS_URL: redis://redis:6379
      # Optional in the Step 4 env schema, so it needs a fallback here: compose
      # only forwards the variables named in this file, and without this line a
      # value set in ./.env would never reach the container. The fallback matches
      # the default built into the code.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Optional in the Step 4 env schema, so it needs a line here for the same
      # reason as CORS_ALLOWED_ORIGINS: compose only forwards the variables named
      # in this file, so a value set in ./.env would otherwise never reach the
      # container. The fallback is `false` (rather than the code's `true`)
      # because this service runs with NODE_ENV=production - the Swagger UI is
      # off unless a value is supplied explicitly. Set ENABLE_SWAGGER=true in
      # ./.env when the docs are wanted in the stack.
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      # Everything below is required by the Step 4 env schema. Values fall back
      # to placeholders so `docker compose up` works on a fresh clone with no
      # .env; Compose picks the real values up from ./.env when it exists.
      JWT_SECRET: ${JWT_SECRET:-local-compose-placeholder-secret}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-local-compose-placeholder-key}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-sandbox}
      SENTRY_DSN: ${SENTRY_DSN:-https://placeholder@example.com/0}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local-compose-placeholder}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local-compose-placeholder}
      # Step 18: the KMS master key that wraps every account's data key. The fallback is
      # a *shape-valid* ARN, because the env schema now refuses an obviously-placeholder
      # key reference - this value decides which key the seeds are encrypted under, so a
      # value that could never be a key is a custody failure, not a missing nicety. Being
      # shape-valid keeps `docker compose up` working on a fresh clone without AWS
      # credentials, and the wallet fails closed instead: the KMS boot probe logs that
      # the key cannot be used, and the first custody call fails. Replace it (or set
      # AWS_KMS_KEY_ID in ./.env) before provisioning anything.
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-arn:aws:kms:eu-west-1:000000000000:key/00000000-0000-0000-0000-000000000000}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-TESTNET}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      # Step 19: the USDC issuer every provisioned account trusts. Required by the env
      # schema, and the fallback is Circle's *Testnet* issuer so `docker compose up` works
      # on a fresh clone: the schema refuses anything that is not a Stellar account id, so
      # the placeholder has to be a real key on the configured network (a nonsense value
      # would stop the container from starting, which is the schema doing its job).
      # Testnet USDC is not money; a real deployment sets this to the issuer it is paid in.
      STELLAR_USDC_ISSUER: ${STELLAR_USDC_ISSUER:-GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5}
      # [optional] Failover Horizon host (Step 17). Commented out because "${VAR:-}"
      # would forward an *empty* string, which the env schema refuses; uncomment to
      # point it at a second host. Note that a Horizon running on the host machine
      # is not "localhost" from inside this container - use
      # http://host.docker.internal:8000.
      # [optional] Non-AWS KMS endpoint (Step 18). Commented out for the same reason as
      # the Horizon fallback above - "${VAR:-}" would forward an *empty* string, which the
      # env schema refuses - and because this service runs NODE_ENV=production, where
      # `validate` refuses the variable outright: custody pointed at a non-AWS endpoint is
      # a different trust boundary. Uncomment to point the stack at a KMS emulator on the
      # host; that emulator has to hold a key with the ARN configured above.
      # AWS_ENDPOINT_URL: http://host.docker.internal:4566
    ports:
      # Host port defaults to 3000; override with API_HOST_PORT when 3000 is
      # already taken on the host (e.g. by another local dev server).
      - '${API_HOST_PORT:-3000}:3000'
    healthcheck:
      # busybox wget ships with node:24-alpine, so no extra tooling is needed.
      # This catches a container that is up but not actually serving.
      # The path carries the /v1 route prefix (`app.setGlobalPrefix` in main.ts) -
      # without it this polls a route that does not exist and the container is
      # reported unhealthy while answering perfectly.
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/v1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cashping
      POSTGRES_PASSWORD: cashping
      POSTGRES_DB: cashping
    ports:
      # Host port is overridable for the same reason as API_HOST_PORT: a machine
      # that already runs its own Postgres on 5432 keeps the more specific
      # 127.0.0.1 binding, shadowing this container, so host-side tools (the
      # Prisma CLI) would silently talk to the wrong server and fail with a
      # confusing P1010. Set POSTGRES_HOST_PORT in .env (and match it in
      # DATABASE_URL) when that happens.
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cashping -d cashping']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # See POSTGRES_HOST_PORT above - same reason, same fix.
      - '${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
